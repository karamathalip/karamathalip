<div style="padding: 1.5rem 0; font-family: var(--font-sans);">

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; margin-bottom: 1.5rem;">
    <div style="background: #1F8EF1; border-radius: 12px; padding: 1rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">PRIMARY</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#1F8EF1</div>
    </div>
    <div style="background: #FF3B30; border-radius: 12px; padding: 1rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">WRONG / FAIL</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#FF3B30</div>
    </div>
    <div style="background: #34C759; border-radius: 12px; padding: 1rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">CORRECT / WIN</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#34C759</div>
    </div>
    <div style="background: #FF9F0A; border-radius: 12px; padding: 1rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">ENERGY / HERO</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#FF9F0A</div>
    </div>
    <div style="background: #AF52DE; border-radius: 12px; padding: 1rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">ACCENT</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#AF52DE</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); gap: 10px; margin-bottom: 1.5rem;">
    <div style="background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 10px; padding: 0.9rem; text-align: center;">
      <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px;">BG LIGHT</div>
      <div style="font-size: 13px; font-weight: 500;">#F0F8FF</div>
    </div>
    <div style="background: #0D0D0D; border-radius: 10px; padding: 0.9rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 4px;">BG DARK</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#0D0D0D</div>
    </div>
    <div style="background: #FFF4E1; border: 0.5px solid var(--color-border-tertiary); border-radius: 10px; padding: 0.9rem; text-align: center;">
      <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px;">BG WARM</div>
      <div style="font-size: 13px; font-weight: 500;">#FFF4E1</div>
    </div>
    <div style="background: #FF2D55; border-radius: 10px; padding: 0.9rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.7); margin-bottom: 4px;">CTA / ALERT</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#FF2D55</div>
    </div>
    <div style="background: #1A1A1A; border-radius: 10px; padding: 0.9rem; text-align: center;">
      <div style="font-size: 11px; color: rgba(255,255,255,0.5); margin-bottom: 4px;">TEXT DARK</div>
      <div style="font-size: 13px; font-weight: 500; color: #fff;">#1A1A1A</div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
    <div style="background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 10px; padding: 1rem;">
      <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 8px;">PRIMARY FONT</div>
      <div style="font-weight: 500; font-size: 18px; letter-spacing: -0.5px;">Montserrat Bold</div>
      <div style="font-size: 12px; color: var(--color-text-secondary);">Headings, hooks, CTA text</div>
    </div>
    <div style="background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 10px; padding: 1rem;">
      <div style="font-size: 11px; color: var(--color-text-secondary); margin-bottom: 8px;">SECONDARY FONT</div>
      <div style="font-weight: 500; font-size: 18px; letter-spacing: -0.3px;">Poppins Bold</div>
      <div style="font-size: 12px; color: var(--color-text-secondary);">Body text, subtitles</div>
    </div>
  </div>

</div>
